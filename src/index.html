<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --border: #e4e4e9;
      --text: #1c1c22;
      --muted: #6b6b76;
      --accent: #4f5bff;
      --rocky: #4f5bff;
      --julian: #ff8a4f;
      --jay: #2fbf8f;
      --up: #2fbf8f;
      --down: #e5484d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { font-size: 20px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    button#refreshBtn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button#refreshBtn:disabled { opacity: 0.6; cursor: default; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .card h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 12px 0;
    }
    .person-card .count { font-size: 32px; font-weight: 700; margin: 2px 0; }
    .person-card .rows { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
    .person-card .delta { font-weight: 600; }
    .delta.up { color: var(--up); }
    .delta.down { color: var(--down); }
    .delta.flat { color: var(--muted); }
    .chart-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 1100px) {
      .chart-row { grid-template-columns: 1fr; }
    }
    .chart-card canvas { max-height: 280px; }
    #loading, #error { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; }
    #error { color: var(--down); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Creative Brief Dashboard &mdash; <?= podLabel ?></h1>
      <div class="sub" id="lastSync">Loading...</div>
    </div>
    <button id="refreshBtn" onclick="refreshNow()">Refresh</button>
  </header>

  <div id="loading">Loading dashboard data...</div>
  <div id="error" style="display:none;"></div>

  <div id="dashboard" style="display:none;">
    <div class="grid" id="personCards"></div>

    <div class="chart-row">
      <div class="card chart-card">
        <h2>Weekly Trend (per person)</h2>
        <canvas id="trendChart"></canvas>
      </div>
      <div class="card chart-card">
        <h2>By Account (this week)</h2>
        <canvas id="accountChart"></canvas>
      </div>
      <div class="card chart-card">
        <h2>By Creative Type (this week)</h2>
        <canvas id="typeChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    var PERSON_COLORS = {}; // filled once data arrives, keyed by person name
    var PALETTE = ['#4f5bff', '#ff8a4f', '#2fbf8f', '#e5484d', '#a855f7'];

    function colorFor(person, people) {
      var idx = people.indexOf(person);
      return PALETTE[idx % PALETTE.length];
    }

    function fmtDelta(delta) {
      if (delta > 0) return { text: '+' + delta, cls: 'up' };
      if (delta < 0) return { text: String(delta), cls: 'down' };
      return { text: '0', cls: 'flat' };
    }

    function renderPersonCards(data) {
      var container = document.getElementById('personCards');
      container.innerHTML = '';
      data.people.forEach(function (person) {
        var thisWeek = data.thisWeekByPerson[person] || 0;
        var lastWeek = data.lastWeekByPerson[person] || 0;
        var delta = fmtDelta(thisWeek - lastWeek);
        var card = document.createElement('div');
        card.className = 'card person-card';
        card.innerHTML =
          '<h2>' + person + '</h2>' +
          '<div class="count">' + thisWeek + '</div>' +
          '<div class="rows">' +
          '<span>Last week: ' + lastWeek + '</span>' +
          '<span class="delta ' + delta.cls + '">' + delta.text + '</span>' +
          '</div>';
        container.appendChild(card);
      });
    }

    function shortWeekLabel(weekStart) {
      var d = new Date(weekStart + 'T00:00:00');
      return (d.getMonth() + 1) + '/' + d.getDate();
    }

    function renderTrendChart(data) {
      var ctx = document.getElementById('trendChart');
      var datasets = data.people.map(function (person) {
        return {
          label: person,
          data: data.weeklyTrend[person],
          borderColor: colorFor(person, data.people),
          backgroundColor: colorFor(person, data.people),
          tension: 0.3,
          fill: false
        };
      });
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.weeks.map(shortWeekLabel),
          datasets: datasets
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } },
          scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      });
    }

    function renderBarChart(canvasId, breakdownObj) {
      var labels = Object.keys(breakdownObj);
      var values = labels.map(function (k) { return breakdownObj[k]; });
      new Chart(document.getElementById(canvasId), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ data: values, backgroundColor: '#4f5bff' }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
      });
    }

    function renderDashboard(data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('lastSync').textContent = data.lastSyncAt
        ? 'Last synced: ' + new Date(data.lastSyncAt).toLocaleString()
        : 'Not synced yet — click Refresh';

      renderPersonCards(data);
      renderTrendChart(data);
      renderBarChart('accountChart', data.accountBreakdown.currentWeek);
      renderBarChart('typeChart', data.creativeTypeBreakdown.currentWeek);
    }

    function loadDashboard() {
      google.script.run
        .withSuccessHandler(renderDashboard)
        .withFailureHandler(showError)
        .getDashboardData();
    }

    function showError(err) {
      document.getElementById('loading').style.display = 'none';
      var el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = 'Error loading dashboard: ' + (err && err.message ? err.message : err);
    }

    function refreshNow() {
      var btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.textContent = 'Refreshing...';
      google.script.run
        .withSuccessHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Refresh';
          loadDashboard();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'Refresh';
          showError(err);
        })
        .refreshData();
    }

    loadDashboard();
  </script>
</body>
</html>
